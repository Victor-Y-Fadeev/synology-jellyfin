name: synology

services:
  proxy:
    image: ghcr.io/xtls/xray-core:pre-release
    container_name: proxy
    restart: unless-stopped
    user: 0:0
    volumes:
      - ./config/xray:/usr/local/etc/xray
    networks:
      default:
        ipv4_address: 10.10.10.10
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./.env
    volumes:
      - ./config/qbittorrent:/config
      - ./data:/data
    depends_on:
      - proxy

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./config/radarr:/config
      - ./data:/data
    dns:
      - 10.10.10.10
    ports:
      - 7878:7878
    depends_on:
      - proxy
      - qbittorrent
      - jellyfin
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./config/sonarr:/config
      - ./data:/data
    dns:
      - 10.10.10.10
    ports:
      - 8989:8989
    depends_on:
      - proxy
      - qbittorrent
      - jellyfin
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./config/prowlarr:/config
    dns:
      - 10.10.10.10
    ports:
      - 9696:9696
    depends_on:
      - proxy
      - qbittorrent
      - radarr
      - sonarr

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - HTTP_PROXY=http://proxy:2080
      - HTTPS_PROXY=http://proxy:2080
    env_file:
      - ./.env
    volumes:
      - ./config/jellyfin:/config
      - ./data:/data
    dns:
      - 10.10.10.10
    ports:
      - 8096:8096
    depends_on:
      - proxy
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    init: true
    env_file:
      - ./.env
    dns:
      - 10.10.10.10
    ports:
      - 5055:5055
    volumes:
      - ./config/seerr:/app/config
    depends_on:
      - proxy
      - radarr
      - sonarr
      - jellyfin

networks:
  default:
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.1
